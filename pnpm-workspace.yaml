packages:
  - "ui/*"
  - "docs/*"
  - "test/*"

peerDependencyRules:
  allowedVersions:
    "eslint-plugin-import>eslint": "10"
    "eslint-plugin-react>eslint": "10"

overrides:
  "@babel/core@7": "7.29.7"
  "brace-expansion@1": "1.1.16"
  "brace-expansion@5": "5.0.7"
  "fast-uri@3": "3.1.4"
  "immutable@5": "5.1.9"
  "js-yaml@3": "3.15.0"
  "js-yaml@4": "4.3.0"
  "undici@7": "7.28.0"
  "vitepress>vite": "6.4.3"

minimumReleaseAgeExclude:
  - prettier@3.9.7

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
